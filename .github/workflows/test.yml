name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux lts
            os: ubuntu-latest
            version: lts
          - name: Linux exact
            os: ubuntu-latest
            version: "9.0.317"
          - name: Linux line
            os: ubuntu-latest
            version: "10.0"
          - name: Linux arm64 latest
            os: ubuntu-24.04-arm
            version: latest
          - name: macOS arm64 sts
            os: macos-15
            version: sts
          - name: macOS x64 exact
            os: macos-15-intel
            version: "8.0.424"
          - name: Windows lts
            os: windows-latest
            version: lts
          - name: Windows exact
            os: windows-latest
            version: "9.0.317"
          - name: Windows arm64 line
            os: windows-11-arm
            version: "10.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}
          cache-key: ${{ matrix.name }}

      - name: Assert output
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.setup.outputs.dotnet-version }}
        run: |
          test -n "$EXPECTED_VERSION" || { echo "dotnet-version output is empty"; exit 1; }
          test "$(dotnet --version)" = "$EXPECTED_VERSION" || { echo "dotnet --version mismatch"; exit 1; }
          test -n "$DOTNET_ROOT" || { echo "DOTNET_ROOT not exported"; exit 1; }
          echo "outputs ok: dotnet-version=$EXPECTED_VERSION dotnet-root=${{ steps.setup.outputs.dotnet-root }}"

      - name: Smoke app
        shell: bash
        run: |
          cd .fixtures/hello
          dotnet run -v:q

      - name: Run twice (cache restore path)
        uses: ./
        with:
          version: ${{ matrix.version }}
          cache-key: ${{ matrix.name }}
        continue-on-error: true